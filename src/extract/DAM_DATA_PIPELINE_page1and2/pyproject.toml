[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dam-data-pipeline"
version = "1.0.0"
requires-python = "==3.12.13"
dependencies = ["pandas", "matplotlib", "pdfplumber==0.11.9", "pdfminer.six==20251230", "Pillow==12.2.0", "pypdfium2==5.12.1", "psutil"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
