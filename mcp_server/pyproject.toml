[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damlevels-mcp"
version = "1.2.1"
description = "Read-only MCP server for the DamLevels-Data archive of Tunisian dam bulletins (2014-2025)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Mohamed Hamza Nasfi"},
  {name = "Soura Boulaares"},
  {name = "Tarek Gasmi"},
]
dependencies = ["mcp>=1.2,<2", "pandas>=2.0", "pyarrow>=14", "pydantic>=2"]

[project.optional-dependencies]
ontology = ["rdflib>=7"]

[project.scripts]
damlevels-mcp = "damlevels_mcp.server:main"

[tool.setuptools]
packages = ["damlevels_mcp"]
